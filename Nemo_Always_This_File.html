<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>니모의 낯선 모험 — 고정 실행기</title><style>body{min-height:100vh;margin:0;display:grid;place-items:center;background:#dcedc7;font:700 17px system-ui;color:#65467e}.panel{max-width:540px;margin:20px;padding:32px;border-radius:28px;border:4px solid #83599a;background:#fff8e9;box-shadow:0 9px #87689d66;text-align:center}h1{font-size:29px}input{width:100%;box-sizing:border-box;padding:14px;font:inherit;border:2px solid #ac80bd;border-radius:12px}button{font:inherit;background:#ffe096;border:3px solid #8a639d;border-radius:14px;padding:12px 22px;margin-top:16px;cursor:pointer}p{font-size:14px;line-height:1.6}</style></head><body><main class="panel"><h1>🐶 니모의 낯선 모험</h1><p>웹사이트를 한 번 연결하면 이 파일은 그대로 두고, 항상 최신 버전의 게임에 접속할 수 있어.</p><form id="form"><input id="site" placeholder="https://주소.github.io/저장소이름/" type="url" required><button>게임 실행하기</button></form><p id="status"></p><button id="reset" type="button">저장된 웹주소 변경</button></main><script>(()=>{const k='nemo_strange_adventure_live_url_v1';const input=document.querySelector('#site');const saved=localStorage.getItem(k);if(saved){input.value=saved;document.querySelector('#status').textContent='저장된 주소로 이동 중…';location.replace(saved);}document.querySelector('#form').onsubmit=e=>{e.preventDefault();let u=input.value.trim();try{const url=new URL(u);if(url.protocol!=='https:')throw Error();u=url.href;localStorage.setItem(k,u);location.assign(u);}catch(e){alert('https://로 시작하는 실제 게임 주소를 넣어줘.')}};document.querySelector('#reset').onclick=()=>{localStorage.removeItem(k);input.value='';document.querySelector('#status').textContent='새 주소를 입력해 줘.';};})();</script></body></html>
