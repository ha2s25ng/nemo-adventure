name: Nemo Adventure - Release QA
on:
  push:
    branches: [release/qa-v5.9.6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.engine }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise release screens and touch choices
        env:
          NEMO_QA_STRICT: '1'
        run: python tests/release_qa.py --engine ${{ matrix.engine }}
      - name: Check deterministic gameplay invariants
        run: node tests/logic/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qa-${{ matrix.engine }}
          path: qa-results/
          retention-days: 14
